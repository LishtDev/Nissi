<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Barbichou's Secret Garden — Joyeux anniversaire Nissi</title>
  <meta name="description" content="Un jardin secret sous un ciel étoilé, préparé avec affection pour l'anniversaire de Nissi, alias Barbichou.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#09090F">

  <!-- Aperçu de partage (optionnel ; remplace l'image par la tienne) -->
  <meta property="og:title" content="Barbichou's Secret Garden">
  <meta property="og:description" content="Quelqu'un a préparé quelque chose pour toi…">
  <meta property="og:type" content="website">

  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Décor de fond : dégradé nocturne + ciel étoilé animé (canvas) -->
  <div class="ciel" aria-hidden="true">
    <div class="brume"></div>
    <div class="lune"></div>
    <canvas id="ciel-canvas"></canvas>
  </div>

  <!-- Lien d'évitement pour la navigation clavier -->
  <a class="evitement" href="#app">Aller au contenu principal</a>

  <header class="entete">
    <p class="marque">Barbichou&rsquo;s <span>Secret Garden</span></p>
    <nav class="progression" aria-label="Progression de l'histoire">
      <ol id="progression-liste" class="progression__liste"></ol>
    </nav>
  </header>

  <main id="app" class="app">

    <!-- ══ CHAPITRE 1 — L'INVITATION ══ -->
    <section class="chapitre chapitre--invitation" data-chapitre="0" aria-labelledby="titre-invitation">
      <div class="carte-verre chapitre__inner">
        <p class="eyebrow" data-content="invitation.eyebrow"></p>
        <h1 id="titre-invitation" class="titre titre--xl" data-content="invitation.titre"></h1>
        <p class="texte texte--lead" data-content="invitation.texte"></p>
        <button type="button" class="btn btn--or" data-action="entrer" data-content="invitation.bouton"></button>
      </div>
    </section>

    <!-- ══ CHAPITRE 2 — LE MESSAGE D'ACCUEIL ══ -->
    <section class="chapitre" data-chapitre="1" aria-labelledby="titre-accueil" hidden>
      <div class="chapitre__inner">
        <p class="eyebrow" data-content="accueil.eyebrow"></p>
        <p class="texte texte--lead" data-content="accueil.texte"></p>
        <h2 id="titre-accueil" class="titre titre--lg contraste" data-content="accueil.titre"></h2>
        <p class="titre titre--md or" data-content="accueil.sousTitre"></p>
        <button type="button" class="btn" data-action="suivant" data-content="accueil.bouton"></button>
      </div>
    </section>

    <!-- ══ CHAPITRE 3 — LA GALERIE DES SOUVENIRS ══ -->
    <section class="chapitre" data-chapitre="2" aria-labelledby="titre-galerie" hidden>
      <div class="chapitre__inner chapitre__inner--large">
        <p class="eyebrow" data-content="galerie.eyebrow"></p>
        <h2 id="titre-galerie" class="titre titre--lg" data-content="galerie.titre"></h2>
        <p class="texte" data-content="galerie.intro"></p>
        <ul id="galerie-grille" class="galerie" role="list"></ul>
        <button type="button" class="btn" data-action="suivant" data-content="galerie.bouton"></button>
      </div>
    </section>

    <!-- ══ CHAPITRE 4 — LA LETTRE POUR BARBICHOU ══ -->
    <section class="chapitre" data-chapitre="3" aria-labelledby="titre-lettre" hidden>
      <div class="chapitre__inner">
        <p class="eyebrow" data-content="lettre.eyebrow"></p>
        <h2 id="titre-lettre" class="titre titre--lg" data-content="lettre.titre"></h2>

        <div class="enveloppe" id="enveloppe">
          <p class="enveloppe__invite" data-content="lettre.sousTitre"></p>
          <button type="button" class="btn btn--or" data-action="ouvrir-lettre" data-content="lettre.boutonOuvrir"></button>
        </div>

        <article class="lettre-papier" id="lettre-papier" hidden>
          <div id="lettre-corps" class="lettre-corps"></div>
          <p id="lettre-signature" class="lettre-signature"></p>
        </article>

        <button type="button" class="btn" data-action="suivant" data-content="lettre.bouton" hidden id="lettre-suivant"></button>
      </div>
    </section>

    <!-- ══ CHAPITRE 5 — LES ÉTOILES DE BARBICHOU (mini-jeu) ══ -->
    <section class="chapitre" data-chapitre="4" aria-labelledby="titre-jeu" hidden>
      <div class="chapitre__inner chapitre__inner--large">
        <p class="eyebrow" data-content="jeu.eyebrow"></p>
        <h2 id="titre-jeu" class="titre titre--lg" data-content="jeu.titre"></h2>
        <p class="texte" data-content="jeu.intro"></p>

        <div class="jeu">
          <p class="jeu__consigne" data-content="jeu.consigne"></p>
          <div id="jeu-ciel" class="jeu__ciel" role="group" aria-label="Ciel étoilé interactif"></div>
          <p id="jeu-progression" class="jeu__progression" role="status" aria-live="polite"></p>
          <p id="jeu-message" class="jeu__message" role="status" aria-live="polite"></p>
          <div class="jeu__actions">
            <button type="button" class="btn btn--fantome" data-action="rejouer-jeu" data-content="jeu.boutonRejouer"></button>
            <button type="button" class="btn" data-action="suivant" data-content="jeu.bouton" disabled id="jeu-suivant"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- ══ CHAPITRE 6 — LA SURPRISE FINALE ══ -->
    <section class="chapitre chapitre--finale" data-chapitre="5" aria-labelledby="titre-finale" hidden>
      <div class="chapitre__inner">
        <p class="eyebrow" data-content="finale.eyebrow"></p>
        <h2 id="titre-finale" class="titre titre--xl" data-content="finale.titre"></h2>
        <div id="finale-texte" class="finale-texte"></div>
        <p class="titre titre--md or" data-content="finale.titreFinal"></p>
        <button type="button" class="btn btn--or" data-action="revoir" data-content="finale.boutonRevoir"></button>
      </div>
    </section>
  </main>

  <!-- Lecteur musical discret, disponible tout au long de l'expérience -->
  <div id="lecteur" class="lecteur" hidden aria-hidden="true">
    <button type="button" id="lecteur-toggle" class="lecteur__btn" aria-pressed="false">
      <span class="lecteur__icone" aria-hidden="true"></span>
      <span class="lecteur__label" id="lecteur-etat"></span>
    </button>
    <div class="lecteur__details">
      <span class="lecteur__barres" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <label class="lecteur__volume">
        <span class="sr-only">Volume</span>
        <input type="range" id="lecteur-volume" min="0" max="1" step="0.01" value="0.5" aria-label="Volume de la musique">
      </label>
      <button type="button" id="lecteur-muet" class="lecteur__muet" aria-pressed="false"></button>
    </div>
    <audio id="lecteur-audio" preload="none"></audio>
  </div>

  <!-- Visionneuse d'images (dialogue natif : focus géré par le navigateur) -->
  <dialog id="visionneuse" class="visionneuse" aria-label="Visionneuse d'images">
    <div class="visionneuse__contenu">
      <button type="button" class="visionneuse__fermer" id="visionneuse-fermer" aria-label="Fermer la visionneuse">&times;</button>
      <div class="visionneuse__media" id="visionneuse-media"></div>
      <p class="visionneuse__legende" id="visionneuse-legende"></p>
      <div class="visionneuse__nav">
        <button type="button" id="visionneuse-prev" class="btn btn--fantome btn--petit"></button>
        <span id="visionneuse-compteur" class="visionneuse__compteur" aria-hidden="true"></span>
        <button type="button" id="visionneuse-next" class="btn btn--fantome btn--petit"></button>
      </div>
    </div>
  </dialog>

  <!-- Région d'annonces pour les lecteurs d'écran -->
  <p id="annonces" class="sr-only" role="status" aria-live="polite"></p>

  <!-- Scripts classiques (pas de modules) : le site fonctionne même ouvert en local -->
  <script src="config/content.js"></script>
  <script src="assets/js/music.js"></script>
  <script src="assets/js/gallery.js"></script>
  <script src="assets/js/game.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
